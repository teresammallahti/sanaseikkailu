<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sanaseikkailu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap">
<style>
  :root{
    --bg-top:#fef6e4;
    --bg-bottom:#e0f7fa;
    --card-bg:#ffffff;
    --ink:#2b2140;
    --accent:#ff8a65;
    --accent-dark:#e8683f;
    --good:#43a047;
    --bad:#e53935;
    --pill-en:#5c6bc0;
    --pill-fi:#26a69a;
    --pill-de:#c0621f;
    --shadow: 0 10px 30px rgba(43,33,64,0.15);
    --radius: 24px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: "Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
    background: linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--ink);
    overflow-x:hidden;
  }
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 12px 16px 24px;
  }
  .lang-switch{
    width:100%;
    max-width:900px;
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:10px;
  }
  .lang-switch-btn{
    border:2px solid transparent;
    background:var(--card-bg);
    color:var(--ink);
    padding:6px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .lang-switch-btn.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent-dark);
  }
  .lang-switch-btn .flag{ font-size:18px; }
  header{
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: clamp(20px, 4vw, 30px);
    font-weight:800;
  }
  .brand .mascot{
    font-size: 1.4em;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  .header-right{ display:flex; align-items:center; gap:10px; }
  .tier-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card-bg);
    padding:8px 16px;
    border-radius:999px;
    box-shadow: var(--shadow);
    font-weight:700;
    font-size: clamp(13px,2.5vw,17px);
  }
  .tier-badge{ gap:6px; }
  .tier-stars{
    letter-spacing:1px;
    color:#f0a63a;
    font-size: 1.7em;
  }
  select#gradeFilter, select#categoryFilter{
    border:none;
    background:var(--card-bg);
    padding:8px 14px;
    border-radius:999px;
    box-shadow: var(--shadow);
    font-weight:700;
    font-size: clamp(12px,2.5vw,15px);
    color:var(--ink);
    max-width: 180px;
  }
  main{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .progress-bar{
    width:100%;
    height:10px;
    background:#ffffffaa;
    border-radius:999px;
    overflow:hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .progress-bar > div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffca28,var(--accent));
    border-radius:999px;
    transition: width .4s ease;
  }
  .progress-label{
    font-size: 12px;
    color:#7a7189;
    align-self:flex-end;
    margin-top:-10px;
  }
  .prompt-card{
    width:100%;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding: 18px 20px;
    text-align:center;
    position:relative;
  }
  .lang-pill{
    display:inline-block;
    padding:4px 16px;
    border-radius:999px;
    color:white;
    font-weight:800;
    font-size: clamp(12px,2.5vw,15px);
    letter-spacing:0.5px;
    margin-bottom:8px;
  }
  .lang-pill.en{ background:var(--pill-en); }
  .lang-pill.fi{ background:var(--pill-fi); }
  .lang-pill.de{ background:var(--pill-de); }
  .prompt-word{
    font-size: clamp(28px, 7vw, 48px);
    font-weight:800;
    margin: 4px 0 2px;
    word-break: break-word;
  }
  .prompt-hint{
    color:#7a7189;
    font-size: clamp(13px,3vw,16px);
  }
  .prompt-category{
    color:#b6adc9;
    font-size: 12px;
    margin-top: 2px;
  }
  .speak-btn{
    margin-top:8px;
    border:none;
    background:#fff3e0;
    color:var(--accent-dark);
    width:46px;
    height:46px;
    border-radius:50%;
    font-size:22px;
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .speak-btn:active{ transform: scale(0.94); }
  .auto-speak-toggle{
    margin-top:6px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:#7a7189;
    cursor:pointer;
    user-select:none;
  }
  .auto-speak-toggle input{
    width:16px;
    height:16px;
    cursor:pointer;
    accent-color: var(--accent-dark, #ff8a3d);
  }

  .answer-area{
    width:100%;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding: 14px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .input-modes{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .mode-btn{
    border:2px solid transparent;
    background:#f4f2fa;
    color:var(--ink);
    padding:8px 16px;
    border-radius:999px;
    font-size: clamp(13px,3vw,15px);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent-dark);
  }

  .stage-indicator{
    text-align:center;
    font-weight:800;
    color:var(--accent-dark);
    font-size: clamp(13px,3vw,16px);
    background:#fff3e0;
    border-radius:999px;
    padding:8px 14px;
  }

  .answer-input-wrap{ display:none; }
  .answer-input-wrap.visible{ display:flex; flex-direction:column; gap:10px; }

  .answer-box{
    width:100%;
    font-size: clamp(20px,5vw,26px);
    padding: 12px 18px;
    border-radius:18px;
    border:3px solid #e6e1f5;
    text-align:center;
    font-weight:700;
    color:var(--ink);
    background:#fbfaff;
  }
  .answer-box:focus{
    outline:none;
    border-color:var(--accent);
  }

  .pen-pad-wrap{ display:none; flex-direction:column; align-items:center; gap:8px; }
  .pen-pad-wrap.visible{ display:flex; }
  canvas.pen-pad{
    width:100%;
    max-width:600px;
    height:160px;
    background:#fbfaff;
    border-radius:18px;
    border:3px solid #e6e1f5;
    touch-action:none;
  }
  .pen-tools{ display:flex; gap:10px; }
  .pen-tools button{
    border:none;
    background:#f4f2fa;
    padding:6px 14px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
  }

  .mic-wrap{ display:none; flex-direction:column; align-items:center; gap:8px; padding: 4px 0; }
  .mic-wrap.visible{ display:flex; }
  .mic-btn{
    width:84px; height:84px;
    border-radius:50%;
    border:none;
    background: radial-gradient(circle at 35% 30%, #ffab91, var(--accent));
    color:white;
    font-size:34px;
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .mic-btn.listening{
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,138,101,0.55); }
    70%{ box-shadow:0 0 0 26px rgba(255,138,101,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,138,101,0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  .mic-hint{ color:#7a7189; font-size:14px; text-align:center; }
  .mic-transcript{
    min-height:26px;
    font-size:19px;
    font-weight:700;
  }
  .pen-stabilizing{
    text-align:center;
    color:var(--accent-dark);
    font-weight:700;
    font-size:14px;
  }

  .actions{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .btn{
    border:none;
    padding: 12px 28px;
    border-radius:999px;
    font-size: clamp(15px,3.5vw,18px);
    font-weight:800;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .btn.primary{
    background: linear-gradient(180deg,#ffca28,var(--accent));
    color:#3a2410;
  }
  .btn.primary:active{ transform: scale(0.97); }
  .btn.ghost{
    background:#f4f2fa;
    color:var(--ink);
  }

  .feedback{
    min-height: 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size: clamp(16px,4vw,21px);
    font-weight:800;
    border-radius:18px;
    padding: 8px 14px;
    transition: background .2s ease;
    text-align:center;
  }
  .feedback.correct{ background:#e8f5e9; color:var(--good); }
  .feedback.incorrect{ background:#ffebee; color:var(--bad); }
  .feedback .answer-reveal{ font-weight:600; font-size:0.75em; color:#7a7189; display:block; }

  /* "Näytä sana" -tila: paljastaa oikean vastauksen ilman että siitä voi
     kopioida sen kirjoituslaatikkoon - laatikko ja tarkistus piilotetaan,
     jäljelle jää vain Ohita, jolla pääsee seuraavaan sanaan. */
  .reveal-box{
    display:none;
    text-align:center;
    font-size: clamp(20px,5vw,26px);
    font-weight:800;
    color:var(--accent-dark);
    background:#fff8e1;
    border:3px solid #ffe082;
    border-radius:18px;
    padding: 14px 18px;
  }
  .answer-area.revealed .reveal-box{ display:block; }
  .answer-area.revealed .input-modes,
  .answer-area.revealed .answer-input-wrap,
  .answer-area.revealed .pen-pad-wrap,
  .answer-area.revealed .mic-wrap,
  .answer-area.revealed #checkBtn,
  .answer-area.revealed #revealBtn{
    display:none !important;
  }

  footer{
    margin-top:14px;
    color:#7a7189cc;
    font-size:12px;
    text-align:center;
  }
  .backup-row{
    margin-top:10px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .backup-btn{
    border:none;
    background:#f4f2fa;
    color:var(--ink);
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .backup-note{
    margin-top:6px;
    font-size:11px;
    color:#7a7189;
    min-height:14px;
  }

  @media (max-width: 420px){
    .prompt-card, .answer-area{ padding:14px 14px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="lang-switch" id="langSwitch">
    <button class="lang-switch-btn active" data-lang="en" aria-pressed="true"><span class="flag">🇬🇧</span> English</button>
    <button class="lang-switch-btn" data-lang="de" aria-pressed="false"><span class="flag">🇩🇪</span> Deutsch</button>
  </div>

  <header>
    <div class="brand"><span class="mascot">🦊</span> Sanaseikkailu</div>
    <div class="header-right">
      <select id="gradeFilter"></select>
      <select id="categoryFilter"><option value="all">Kaikki teemat</option></select>
      <div class="tier-badge" id="tierBadge" title="Palkintotaso valitulta luokka-asteelta">
        <span id="tierModeIcon">⌨️</span>
        <span id="tierIcon">🐍</span>
        <span id="tierLabel">Kärmes</span>
        <span class="tier-stars" id="tierStars">☆☆☆☆☆</span>
      </div>
    </div>
  </header>

  <main>
    <div style="width:100%">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Seuraavaan tähteen: 0%</div>
    </div>

    <section class="prompt-card">
      <span class="lang-pill" id="langPill">EN</span>
      <div class="prompt-word" id="promptWord">…</div>
      <div class="prompt-hint" id="promptHint">Ladataan sanastoa…</div>
      <div class="prompt-category" id="promptCategory"></div>
      <button class="speak-btn" id="hearBtn" title="Kuuntele sana">🔊</button>
      <label class="auto-speak-toggle" for="autoSpeakToggle">
        <input type="checkbox" id="autoSpeakToggle" checked>
        <span id="autoSpeakLabel">Lausu englanninkieliset sanat automaattisesti</span>
      </label>
    </section>

    <section class="answer-area">
      <div class="input-modes" id="inputModes">
        <button class="mode-btn" data-mode="pen">✏️ Kynä</button>
        <button class="mode-btn active" data-mode="keyboard">⌨️ Näppäimistö</button>
        <button class="mode-btn" data-mode="mic">🎤 Puhu</button>
      </div>

      <div class="answer-input-wrap visible" id="mode-keyboard">
        <input type="text" class="answer-box" id="answerBox" placeholder="Kirjoita vastaus tähän..." autocomplete="off">
      </div>

      <div class="pen-pad-wrap" id="mode-pen">
        <canvas class="pen-pad" id="penPad"></canvas>
        <div class="pen-tools" id="penTools">
          <button id="penClear">🗑️ Tyhjennä</button>
        </div>
        <input type="text" class="answer-box" id="penFallbackBox" placeholder="Kirjoita kynällä tähän..." autocomplete="off" hidden>
        <div class="mic-hint" id="penHint"></div>
        <div class="pen-stabilizing" id="penStabilizing" hidden>⏳ Vahvistetaan...</div>
        <div class="mic-transcript" id="penReading"></div>
      </div>

      <div class="mic-wrap" id="mode-mic">
        <button class="mic-btn" id="micBtn">🎤</button>
        <div class="mic-hint">Paina ja sano sana ääneen — tarkistan sen heti</div>
        <div class="mic-transcript" id="micTranscript"></div>
      </div>

      <div class="reveal-box" id="revealBox"></div>

      <div class="actions">
        <button class="btn ghost" id="skipBtn">Ohita</button>
        <button class="btn ghost" id="revealBtn">👁️ Näytä sana</button>
        <button class="btn primary" id="checkBtn">Tarkista</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </section>
  </main>

  <footer>
    Sanaseikkailu · pilottiversio · kynä- ja puhesyöttö (vaihe 5)
    <div class="backup-row">
      <button class="backup-btn" id="exportBtn" title="Tallenna edistyminen tiedostoon">💾 Varmuuskopio</button>
      <button class="backup-btn" id="importBtn" title="Tuo edistyminen varmuuskopiotiedostosta">📂 Tuo varmuuskopio</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="backup-note" id="backupNote"></div>
  </footer>
</div>

<script>
/*
  YDINLOGIIKKA - vaihe 4
  -----------------------
  - Koko sanasto (en_4lk_v2.json) upotettuna suoraan tiedostoon, jotta sovellus
    toimii myös avattaessa suoraan tiedostojärjestelmästä (file://) ilman
    palvelinta - selaimet estävät usein paikallisten JSON-tiedostojen fetch-haun
    file://-protokollalla. Kun sovellus julkaistaan oikealla web-palvelimella,
    tämä voidaan tarvittaessa vaihtaa fetch()-hakuun samasta tiedostosta.
  - Edistyminen tallennetaan selaimen IndexedDB:hen geneerisellä rakenteella
    (avain = kieli|taso|sanan id), joten sama tietokantarakenne toimii
    myöhemmin myös saksalle ja muille luokka-asteille.
  - Sanan valinta painottaa sanoja, joissa on ollut virheitä tai joita ei ole
    vielä nähty - tämä on yksinkertaistettu pohja, jota laajennetaan vaiheessa 7
    (kertaus vaikeista sanoista / spaced repetition).
  - Kynä (käsinkirjoitustunnistus) ja puhe (oikea puheentunnistusintegraatio)
    ovat edelleen kevyitä demoja - niiden syvempi toteutus tulee vaiheessa 5.
*/

const VOCAB = __WORD_DATA__;

const DB_NAME = "kieliohjelma_db";
const DB_VERSION = 1;
const STORE = "word_stats";
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if (!_db.objectStoreNames.contains(STORE)){
        _db.createObjectStore(STORE, { keyPath: "statId" });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e);
  });
}

function statId(word){
  return `${targetLang}|${VOCAB.meta.level}|${word.id}`;
}

function getStat(word){
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(statId(word));
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

function getAllStats(){
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function putStat(stat){
  return new Promise((resolve) => {
    if (!db) return resolve();
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(stat);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

// --- Kielivalinta: mitä kohdekieltä (en/de) harjoitellaan suomea vastaan ---
const LANGS = {
  en: { flag: "🇬🇧", label: "englanniksi", speech: "en-GB" },
  de: { flag: "🇩🇪", label: "saksaksi", speech: "de-DE" }
};
let targetLang = "en";
try {
  const savedLang = localStorage.getItem("targetLang");
  if (savedLang && LANGS[savedLang]) targetLang = savedLang;
} catch (e) { /* localStorage ei käytettävissä - käytetään oletusta */ }

// --- Sanaston valmistelu: suodata pois mallilauseet (esim. "my name is ...") ---
// Sama sanasto ja samat id:t kaikille kielille - jokaisella sanalla on sekä en- että de-kenttä.
function practiceWords(){
  return VOCAB.words.filter(w => !w.fi.includes("...") && !(w[targetLang] || "").includes("..."));
}
let PRACTICE_WORDS = practiceWords();

let statsCache = {}; // statId -> stat
let current = null;
let direction = "target-fi";
let activeMode = "keyboard";
let currentCategory = "all";

const promptWord = document.getElementById("promptWord");
const promptHint = document.getElementById("promptHint");
const promptCategory = document.getElementById("promptCategory");
const langPill = document.getElementById("langPill");
const answerBox = document.getElementById("answerBox");
const feedback = document.getElementById("feedback");
const answerArea = document.querySelector(".answer-area");
const revealBox = document.getElementById("revealBox");
const revealBtn = document.getElementById("revealBtn");
const tierBadge = document.getElementById("tierBadge");
const tierModeIcon = document.getElementById("tierModeIcon");
const tierIcon = document.getElementById("tierIcon");
const tierLabelEl = document.getElementById("tierLabel");
const tierStarsEl = document.getElementById("tierStars");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const hearBtn = document.getElementById("hearBtn");
const categoryFilter = document.getElementById("categoryFilter");
const autoSpeakToggle = document.getElementById("autoSpeakToggle");
const autoSpeakLabel = document.getElementById("autoSpeakLabel");
const inputModesEl = document.getElementById("inputModes");
let autoSpeakTimer = null;

// Syöttötapa (kynä/näppäimistö/puhe) vaihtuu VAIN kun lapsi itse valitsee sen
// tilapainikkeista - sovellus ei koskaan vaihda tilaa automaattisesti kesken
// harjoittelun, vaikka sana etenisikin taustalla vaiheesta toiseen. Näin lapsi
// voi pysyä esim. pelkässä kynäkirjoituksessa niin pitkään kuin haluaa.

// Muistetaan valinta laitteella, jos selain sallii (ei vaikuta tallennettuun edistymiseen).
try {
  const saved = localStorage.getItem("autoSpeak");
  if (saved !== null) autoSpeakToggle.checked = saved === "1";
} catch (e) { /* localStorage ei käytettävissä - käytetään oletusta */ }

autoSpeakToggle.addEventListener("change", () => {
  try { localStorage.setItem("autoSpeak", autoSpeakToggle.checked ? "1" : "0"); }
  catch (e) { /* ei tallenneta, ei haittaa toimintaa */ }
});

function updateAutoSpeakLabel(){
  autoSpeakLabel.textContent = `Lausu ${LANGS[targetLang].label} olevat sanat automaattisesti`;
}

function speakWord(){
  if (!("speechSynthesis" in window)) return;
  const utter = new SpeechSynthesisUtterance(promptWord.textContent);
  utter.lang = direction === "target-fi" ? LANGS[targetLang].speech : "fi-FI";
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// --- Kielivalintanapit (lippukuvakkeet) ---
const langSwitchButtons = document.querySelectorAll(".lang-switch-btn");

function syncLangButtons(){
  langSwitchButtons.forEach(btn => {
    const active = btn.dataset.lang === targetLang;
    btn.classList.toggle("active", active);
    btn.setAttribute("aria-pressed", active ? "true" : "false");
  });
  updateAutoSpeakLabel();
}

function selectTargetLang(lang){
  if (!LANGS[lang] || lang === targetLang) return;
  targetLang = lang;
  try { localStorage.setItem("targetLang", targetLang); } catch (e) { /* ei haittaa */ }
  syncLangButtons();
  PRACTICE_WORDS = practiceWords();
  // Kummallakin kielellä on oma luokka-aste muistissa (esim. saksa voi olla
  // vasta alkanut, vaikka englanti olisi jo pidemmällä).
  activeGrade = loadOrDetectGrade(targetLang);
  currentCategory = "all";
  populateGradeOptions();
  populateCategoryOptions();
  current = null;
  initSessionPool();
  pickWord();
}

langSwitchButtons.forEach(btn => {
  btn.addEventListener("click", () => selectTargetLang(btn.dataset.lang));
});

function categoryName(id){
  const c = VOCAB.categories.find(c => c.id === id);
  return c ? c.name_fi : id;
}

function categoryGroup(id){
  const c = VOCAB.categories.find(c => c.id === id);
  return c ? (c.group || "ops") : "ops";
}

// --- Luokka-asteet: sanasto ryhmitelty peruskoulun luokka-asteille 1-6 ---
// Jokaisella teemakategorialla on VOCAB.categories-listassa "grade"-kenttä
// (1-6, tai null harrasteteemoille kuten Minecraft/Fortnite, jotka pysyvät
// aina käsin valittavissa luokka-asteesta riippumatta). Oppilas valitsee ensin
// luokka-asteen ja sitten teeman - teemavalikko näyttää vain kyseisen
// luokka-asteen teemat (+ harrasteteemat, jotka näkyvät aina).
const GRADES = [1, 2, 3, 4, 5, 6];
let activeGrade = 1;
const gradeFilter = document.getElementById("gradeFilter");

function wordGrade(word){
  const c = VOCAB.categories.find(c => c.id === word.category);
  return c ? c.grade : null;
}

function wordsForGrade(g){
  return PRACTICE_WORDS.filter(w => wordGrade(w) === g);
}

// Luokka-aste on "valmis" kun KAIKKI sen sanat on opittu kokonaan (kaikki
// kolme vaihetta graduoitu) - sama tiukka kriteeri kuin kokonaisedistymisessä.
function isGradeComplete(g){
  const list = wordsForGrade(g);
  return list.length > 0 && list.every(w => isFullyLearned(statsCache[statId(w)]));
}

function gradeStorageKey(lang){ return "grade_" + lang; }

function hasExplicitGradeChoice(lang){
  try { return localStorage.getItem(gradeStorageKey(lang)) !== null; }
  catch (e) { return false; }
}

function saveGradeChoice(lang, grade){
  try { localStorage.setItem(gradeStorageKey(lang), String(grade)); }
  catch (e) { /* ei haittaa */ }
}

// Jos oppilaalle ei ole vielä tällä laitteella valittu luokka-astetta erikseen,
// päätellään lähtökohta tilastoista: matalin luokka-aste, jota EI ole vielä
// kokonaan opittu (esim. jos sanasto oli ennen luokka-asteiden lisäystä jo
// pitkälti opittu, oppilas ei jää jumiin ykkösluokkaan).
function detectFrontierGrade(){
  for (const g of GRADES){
    if (!isGradeComplete(g)) return g;
  }
  return GRADES[GRADES.length - 1];
}

function loadOrDetectGrade(lang){
  try {
    const saved = localStorage.getItem(gradeStorageKey(lang));
    if (saved){
      const n = parseInt(saved, 10);
      if (GRADES.includes(n)) return n;
    }
  } catch (e) { /* ei haittaa */ }
  return detectFrontierGrade();
}

// Rakentaa luokka-astevalikon vaihtoehdot uudelleen - kutsutaan aina kun
// valmistumistilanne (vihreä teksti) tai valittu luokka-aste voi olla muuttunut.
function populateGradeOptions(){
  gradeFilter.innerHTML = "";
  GRADES.forEach(g => {
    const opt = document.createElement("option");
    opt.value = String(g);
    const complete = isGradeComplete(g);
    opt.textContent = (complete ? "✅ " : "") + g + ". luokka";
    opt.style.color = complete ? "#2e7d32" : "";
    if (g === activeGrade) opt.selected = true;
    gradeFilter.appendChild(opt);
  });
}

function setupGradeFilter(){
  populateGradeOptions();
  gradeFilter.addEventListener("change", () => {
    activeGrade = parseInt(gradeFilter.value, 10);
    saveGradeChoice(targetLang, activeGrade);
    currentCategory = "all";
    populateCategoryOptions();
    current = null;
    initSessionPool();
    pickWord();
  });
}

// Kun luokka-aste on kokonaan opittu, oppilas siirtyy automaattisesti seuraavalle
// luokka-asteelle - tarkistetaan aina ennen uuden sanan valintaa.
function maybeAdvanceGrade(){
  if (activeGrade < GRADES.length && isGradeComplete(activeGrade)){
    activeGrade += 1;
    saveGradeChoice(targetLang, activeGrade);
    currentCategory = "all";
    populateCategoryOptions();
    initSessionPool();
  }
}

// Teemavalikko näyttää vain valitun luokka-asteen teemat, sekä harrasteteemat
// (group=hobby), jotka näkyvät aina luokka-asteesta riippumatta.
function populateCategoryOptions(){
  categoryFilter.innerHTML = "";
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = "Kaikki teemat";
  categoryFilter.appendChild(allOpt);
  VOCAB.categories
    .filter(c => c.grade === activeGrade || c.group === "hobby")
    .forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name_fi;
      categoryFilter.appendChild(opt);
    });
  categoryFilter.value = currentCategory;
}

function setupCategoryFilter(){
  populateCategoryOptions();
  categoryFilter.addEventListener("change", () => {
    currentCategory = categoryFilter.value;
    initSessionPool();
    pickWord();
  });
}

function activeWordPool(){
  const pool = eligibleWordsForCategoryScope(currentCategory);
  return pool.length ? pool : wordsForGrade(activeGrade);
}

// Sanat, jotka voivat kiertää automaattisessa aktiivijoukossa valitulla luokka-asteella
// ja teemarajauksella. Harrasteteemat (group=hobby, esim. Minecraft/Fortnite) ohittavat
// luokka-asterajauksen kokonaan - ne ovat vain käsin valittavissa teemavalikosta.
function eligibleWordsForCategoryScope(catId){
  if (catId !== "all" && categoryGroup(catId) === "hobby"){
    return PRACTICE_WORDS.filter(w => w.category === catId);
  }
  const gradeScoped = wordsForGrade(activeGrade);
  return catId === "all" ? gradeScoped : gradeScoped.filter(w => w.category === catId);
}

// Kun oman luokka-asteen (ja teemarajauksen) sanat alkavat loppua, täydennetään
// seuraavan ylemmän luokka-asteen sanoista (helpoimmasta päästä, eli siitä
// järjestyksestä jossa ne on sanastoon kirjoitettu) - oppilas ei koskaan jää
// ilman uusia sanoja, vaikka oma luokka-aste olisi lähes kokonaan opittu.
function nextGradeFallbackWords(catId, excludeIds){
  for (let g = activeGrade + 1; g <= GRADES.length; g++){
    const gradeWords = wordsForGrade(g);
    const scoped = catId === "all" ? gradeWords : gradeWords.filter(w => w.category === catId);
    const usable = (scoped.length ? scoped : gradeWords).filter(w => !excludeIds.has(w.id));
    if (usable.length) return usable;
  }
  return [];
}

// --- Kolmivaiheinen oppimispolku: piirrä -> kirjoita -> puhu ---
// Vaihe 1 (piirto): sana pitää saada kerran oikein KUMPAANKIN suuntaan
// (kohdekieli->suomi ja suomi->kohdekieli) ilman että väliin tulee väärä
// vastaus siinä suunnassa. Vaihe 2 (näppäimistö) ja vaihe 3 (puhe) eivät
// erottele suuntaa: kumpi tahansa suunta kelpaa, kunhan peräkkäisiä oikeita
// vastauksia kertyy vaadittu määrä ilman yhtäkään väärää välissä.
//
// Jokaisella vaiheella on KAKSI kynnystä:
// - "Pass": alkuperäinen oppimiskriteeri - kun täyttyy, sanan näyttötiheys
//   puolittuu, jotta fokus siirtyy muihin vielä opeteltaviin sanoihin.
// - "Graduate": Pass + 2 lisäkertaa oikein samalla tavalla - kun täyttyy,
//   sana siirtyy pysyvästi hierarkiassa seuraavalle vaiheelle (piirto -> näppäimistö
//   -> puhe) eikä sitä enää näytetä alemmalla vaiheella, paitsi harvakseltaan kertauksena.
const PEN_PASS = 1, PEN_GRADUATE = 3;
const KEYBOARD_PASS = 3, KEYBOARD_GRADUATE = 5;
const MIC_PASS = 4, MIC_GRADUATE = 6;

function stagePenPassed(stat){
  return !!stat
    && (stat.streakTargetFi || 0) >= PEN_PASS
    && (stat.streakFiTarget || 0) >= PEN_PASS;
}
function stagePenGraduated(stat){
  return !!stat
    && (stat.streakTargetFi || 0) >= PEN_GRADUATE
    && (stat.streakFiTarget || 0) >= PEN_GRADUATE;
}
function stageKeyboardPassed(stat){
  return !!stat && (stat.streakKeyboard || 0) >= KEYBOARD_PASS;
}
function stageKeyboardGraduated(stat){
  return !!stat && (stat.streakKeyboard || 0) >= KEYBOARD_GRADUATE;
}
function stageMicPassed(stat){
  return !!stat && (stat.streakMic || 0) >= MIC_PASS;
}
function stageMicGraduated(stat){
  return !!stat && (stat.streakMic || 0) >= MIC_GRADUATE;
}
// Sana on täysin opittu vasta kun kaikki kolme vaihetta on graduoitu.
function isFullyLearned(stat){
  return stagePenGraduated(stat) && stageKeyboardGraduated(stat) && stageMicGraduated(stat);
}
// Kertoo, onko sana Pass-tasolla PARHAILLAAN VALITUSSA harjoittelutavassa
// (näyttötiheyden puolitusta varten). Koska syöttötapa ei enää vaihdu
// automaattisesti (ks. activeMode-kommentti yllä), tämä katsoo aina sitä
// menetelmää, jonka lapsi on itse valinnut - ei mitään oletettua hierarkiaa.
function stageStatusForWord(word){
  const stat = statsCache[statId(word)];
  let passed = false;
  if (activeMode === "pen") passed = stagePenPassed(stat);
  else if (activeMode === "keyboard") passed = stageKeyboardPassed(stat);
  else if (activeMode === "mic") passed = stageMicPassed(stat);
  return { stage: activeMode, passed };
}

// --- Palkintotasot: 6 päätasoa x 5 tähteä = 30 yhtä suurta askelta ---
// Lasketaan aina prosenttiosuutena opituista sanoista koko senhetkisestä
// kohdekielen sanastosta, joten taso mukautuu automaattisesti, jos sanastoon
// lisätään sanoja (taso laskee) tai sanasto pilkotaan pienemmäksi kokonaisuudeksi
// (taso nousee) - eteneminen on tallessa sanakohtaisesti, ei tasoa kohti.
const LEVELS = ["Kärmes", "Basiliski", "Aarnikotka", "Hydra", "Traakki", "Lohikäärme"];
const LEVEL_ICONS = ["🐍", "🦎", "🦅", "🐙", "🐊", "🐉"];
const TOTAL_TIER_STEPS = LEVELS.length * 5; // 30

// exactSteps on liukuluku (ei pyöristetty) - stars/majorIndex tarvitaan kokonaislukuina
// tähtisymboleja ja tasonimeä varten, mutta edistymispalkki (ks. renderTierBadge)
// tarvitsee myös murto-osan seuraavaan tähteen, joten se lasketaan tästä erikseen.
function tierState(masteredN, totalN){
  if (!totalN) return { majorIndex: 0, stars: 0, exactSteps: 0 };
  const exactSteps = masteredN >= totalN
    ? TOTAL_TIER_STEPS
    : (masteredN / totalN) * TOTAL_TIER_STEPS;
  const stepsEarned = Math.floor(exactSteps);
  const majorIndex = Math.min(LEVELS.length - 1, Math.floor(stepsEarned / 5));
  const stars = stepsEarned - majorIndex * 5;
  return { majorIndex, stars, exactSteps };
}

// Tasonimi näytetään aina ilman tähtimäärää sanoina - tähtien määrä näkyy
// lapselle vain tähtisymbolien täyttymisenä (ks. tierStarsEl), ei tekstinä.
function tierLabel(majorIndex){
  return LEVELS[majorIndex];
}

// --- Erilliset palkintoasteikot per harjoittelutapa (piirrä/kirjoita/puhu) ---
// Aiemmin yksi yhteinen tähtimittari vaati KAIKKIEN kolmen vaiheen graduoitumista
// samalta sanalta ennen kuin tähtikään syttyi, mikä teki etenemisestä liian hidasta
// ja raskasta (yhdeksän sanan kaikki kolme vaihetta per tähti). Nyt jokaisella
// menetelmällä on oma asteikkonsa, joka täyttyy sitä mukaa kun sanoja graduoituu
// KYSEISESSÄ vaiheessa - eteneminen näkyy siis heti eikä vaadi muiden vaiheiden
// valmistumista. Yläpalkin tähtibadge näyttää aina sen menetelmän asteikkoa, joka
// on parhaillaan valittuna/käytössä (vaihtuu automaattisesti tilan mukana).
const MODE_GRADUATED_CHECK = {
  pen: stagePenGraduated,
  keyboard: stageKeyboardGraduated,
  mic: stageMicGraduated
};
const MODE_ICONS = { pen: "✏️", keyboard: "⌨️", mic: "🎤" };
const MODE_NAMES = { pen: "Piirto", keyboard: "Näppäimistö", mic: "Puhe" };
let tierByMode = { pen: null, keyboard: null, mic: null };

function renderTierBadge(){
  const t = tierByMode[activeMode] || tierByMode.keyboard;
  if (!t) return; // tilastoja ei vielä ladattu (ensimmäinen renderöinti ennen DB:tä)
  tierModeIcon.textContent = MODE_ICONS[activeMode] || "";
  tierIcon.textContent = LEVEL_ICONS[t.majorIndex];
  tierLabelEl.textContent = tierLabel(t.majorIndex);
  tierStarsEl.textContent = "★".repeat(t.stars) + "☆".repeat(5 - t.stars);
  tierBadge.title = `${MODE_NAMES[activeMode] || ""}: opittu ${t.n}/${wordsForGrade(activeGrade).length} sanaa (${activeGrade}. luokka, ${LANGS[targetLang].label})`;

  // Edistymispalkki näyttää parhaillaan valitun menetelmän matkan SEURAAVAAN
  // tähteen (ei enää koko sanaston kokonaisosaamista) - eli exactStepsin
  // murto-osan nykyisen tähden ja seuraavan välillä. Täysin maksimitasolla
  // (kaikki tähdet/tasot täynnä) palkki näytetään täytenä.
  const isMaxed = t.exactSteps >= TOTAL_TIER_STEPS;
  const progressToNext = isMaxed ? 1 : t.exactSteps - Math.floor(t.exactSteps);
  const pct = Math.round(progressToNext * 100);
  progressFill.style.width = pct + "%";
  progressLabel.textContent = isMaxed ? "Kaikki tähdet täynnä! ✨" : `Seuraavaan tähteen: ${pct}%`;
}

async function updateHeaderStats(){
  const all = await getAllStats();
  statsCache = {};
  all.forEach(s => statsCache[s.statId] = s);

  // Palkintotaso lasketaan VALITUN LUOKKA-ASTEEN sanastosta (ei koko kohdekielen
  // sanastosta eikä teemasuodattimesta), jotta mittari vaihtuu heti kun oppilas
  // vaihtaa luokka-astetta. Jokaiselle menetelmälle laskettu erikseen (ks. yllä).
  const gradeWordsList = wordsForGrade(activeGrade);
  ["pen", "keyboard", "mic"].forEach(mode => {
    const check = MODE_GRADUATED_CHECK[mode];
    const n = gradeWordsList.filter(w => check(statsCache[statId(w)])).length;
    const { majorIndex, stars, exactSteps } = tierState(n, gradeWordsList.length);
    tierByMode[mode] = { n, majorIndex, stars, exactSteps };
  });
  renderTierBadge();
  populateGradeOptions(); // päivittää valmiiden luokka-asteiden vihreän merkinnän
}

function weightFor(word){
  const s = statsCache[statId(word)];
  if (!s) return 5; // ei nähty vielä -> näytetään mieluummin
  let w = 1;
  w += (s.incorrectCount || 0) * 2;
  w -= Math.min(s.streakCorrect || 0, 3);
  w = Math.max(1, w);
  // Kun nykyisen vaiheen Pass-kynnys on täyttynyt, sanaa näytetään puolet harvemmin,
  // kunnes Graduate-kynnys täyttyy ja sana siirtyy seuraavalle vaiheelle kokonaan.
  if (stageStatusForWord(word).passed) w *= 0.5;
  return w;
}

function weightedPick(pool, avoidId){
  const candidates = pool.filter(w => w.id !== avoidId);
  const usable = candidates.length ? candidates : pool;
  const weights = usable.map(weightFor);
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < usable.length; i++){
    r -= weights[i];
    if (r <= 0) return usable[i];
  }
  return usable[usable.length - 1];
}

// --- Aktiivinen sanaryhmä (rullaava ikkuna) ---
// Ruudulla kierrätetään kerrallaan enintään ACTIVE_POOL_MAX sanaa, jottei koko
// teeman (tai koko sanaston) laajuus tee sanojen hyväksytyksi saamisesta liian
// hidasta - se voisi olla oppijalle demotivoivaa. Kun sana graduoituu pois
// nykyiseltä vaiheelta, se poistuu aktiivijoukosta ja tilalle otetaan uusi sana
// samasta teemasta; jos teema loppuu kesken, täydennetään teemasta "yleissanat".
// Harrasteteemat (group=hobby) eivät koskaan toimi automaattitäydennyksen lähteenä.
const ACTIVE_POOL_MIN = 10;
const ACTIVE_POOL_MAX = 15;
// Todennäköisyys, jolla kierros nostaa harjoitteluun jo täysin opitun (graduoidun)
// sanan aktiivijoukon sijaan - pitää opitut sanat mielessä ilman että ne vievät
// tilaa varsinaiselta oppimiselta.
const REVIEW_CHANCE = 0.15;
let sessionPool = [];
let sessionPoolCategory = null;
let sessionPoolMode = null;
let sessionPoolGrade = null;

// Graduoituminen tarkistetaan PARHAILLAAN VALITUSTA harjoittelutavasta, ei
// kaikista kolmesta yhdessä - koska syöttötapa ei enää vaihdu automaattisesti,
// aktiivijoukon täytyy tuoda uusia sanoja sitä mukaa kun ne graduoituvat SIINÄ
// tilassa, jota lapsi juuri harjoittelee (esim. pelkkä kynä), eikä vasta sitten
// kun kaikki kolme vaihetta on suoritettu.
function isGraduatedWord(word){
  const stat = statsCache[statId(word)];
  if (activeMode === "pen") return stagePenGraduated(stat);
  if (activeMode === "mic") return stageMicGraduated(stat);
  return stageKeyboardGraduated(stat);
}

function graduatedWordsInScope(catId){
  return eligibleWordsForCategoryScope(catId).filter(isGraduatedWord);
}

// Täyttää pool-taulukkoa candidates-listasta needed-kokoon asti, ohittaen jo
// mukana olevat (excludeIds) ja graduoituneet sanat.
function fillPoolFrom(candidates, pool, excludeIds, needed){
  for (const w of candidates){
    if (pool.length >= needed) break;
    if (excludeIds.has(w.id) || isGraduatedWord(w)) continue;
    pool.push(w);
    excludeIds.add(w.id);
  }
}

// Täydentää annettua pool-taulukkoa: ensin nykyisen luokka-asteen ja teemarajauksen
// (catId) kesken olevista/uusista sanoista. Jos ACTIVE_POOL_MIN ei täyty eikä
// rajaus itse ole harrasteteema, täydennetään ensin saman luokka-asteen muista
// teemoista, ja jos sekään ei riitä, seuraavan ylemmän luokka-asteen sanoista.
function topUpPool(pool, catId, excludeIds){
  const isHobby = catId !== "all" && categoryGroup(catId) === "hobby";
  const primary = eligibleWordsForCategoryScope(catId).filter(w => !excludeIds.has(w.id));
  fillPoolFrom(primary.filter(w => statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MAX);
  fillPoolFrom(primary.filter(w => !statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MAX);
  if (pool.length < ACTIVE_POOL_MIN && !isHobby && catId !== "all"){
    const sameGrade = wordsForGrade(activeGrade).filter(w => !excludeIds.has(w.id));
    fillPoolFrom(sameGrade.filter(w => statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MIN);
    fillPoolFrom(sameGrade.filter(w => !statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MIN);
  }
  if (pool.length < ACTIVE_POOL_MIN && !isHobby && activeGrade < GRADES.length){
    const upper = nextGradeFallbackWords(catId, excludeIds);
    fillPoolFrom(upper.filter(w => statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MIN);
    fillPoolFrom(upper.filter(w => !statsCache[statId(w)]), pool, excludeIds, ACTIVE_POOL_MIN);
  }
  return pool;
}

function buildSessionPool(catId){
  return topUpPool([], catId, new Set());
}

// Rakentaa aktiivijoukon tyhjästä - kutsutaan sovelluksen käynnistyessä, teeman
// vaihtuessa, kohdekielen vaihtuessa ja aina kun lapsi vaihtaa syöttötapaa
// käsin (koska graduoitumiskriteeri riippuu nyt valitusta tavasta, ks. yllä).
function initSessionPool(){
  sessionPool = buildSessionPool(currentCategory);
  sessionPoolCategory = currentCategory;
  sessionPoolMode = activeMode;
  sessionPoolGrade = activeGrade;
}

// Kutsutaan joka kierroksella pickWord():ssä. Pooli pysyy vakaana eikä rakennu
// tyhjästä joka kerta - vain graduoituneet sanat poistetaan ja tilalle täydennetään.
function pruneAndRefillSessionPool(){
  if (sessionPoolCategory !== currentCategory || sessionPoolMode !== activeMode || sessionPoolGrade !== activeGrade){
    initSessionPool();
    return;
  }
  sessionPool = sessionPool.filter(w => !isGraduatedWord(w));
  if (sessionPool.length < ACTIVE_POOL_MAX){
    const excludeIds = new Set(sessionPool.map(w => w.id));
    topUpPool(sessionPool, currentCategory, excludeIds);
  }
}

async function pickWord(){
  // Jos edellinen sana juuri täytti koko luokka-asteen, siirrytään ensin
  // automaattisesti seuraavalle luokka-asteelle (ks. maybeAdvanceGrade).
  maybeAdvanceGrade();
  // Valinta tehdään muistissa olevilla tiedoilla ja sana näytetään heti,
  // mittarit päivitetään tietokannasta vasta sen jälkeen.
  pruneAndRefillSessionPool();
  let pool;
  if (Math.random() < REVIEW_CHANCE){
    const reviewPool = graduatedWordsInScope(currentCategory);
    pool = reviewPool.length ? reviewPool : sessionPool;
  } else {
    pool = sessionPool;
  }
  if (!pool.length) pool = activeWordPool();
  current = weightedPick(pool, current ? current.id : null);
  direction = Math.random() < 0.5 ? "target-fi" : "fi-target";
  renderPrompt();
  await updateHeaderStats();
}

function firstAcceptedAnswer(text){
  // Jos vastauksessa on vaihtoehtoja "/"-merkillä (esim. kohteliaisuusfraasit), näytetään ensimmäinen.
  return text.split("/")[0].trim();
}

function renderPrompt(){
  feedback.className = "feedback";
  feedback.textContent = "";
  answerBox.value = "";
  // Uusi sana -> piilotetaan mahdollinen edellisen sanan "Näytä sana" -paljastus
  // ja palautetaan kirjoituslaatikko näkyviin.
  answerArea.classList.remove("revealed");
  revealBox.textContent = "";
  // Näppäimistö avautuu automaattisesti vain näppäimistövaiheessa - piirto- ja
  // puhevaiheessa lapsen pitää itse koskettaa oikeaa kenttää, ettei Gboard
  // ponnahda esiin kutsumatta kesken piirtämisen.
  if (activeMode === "keyboard") answerBox.focus({ preventScroll: true });
  promptCategory.textContent = categoryName(current.category);
  if (direction === "target-fi"){
    promptWord.textContent = firstAcceptedAnswer(current[targetLang]);
    langPill.textContent = targetLang.toUpperCase();
    langPill.className = "lang-pill " + targetLang;
    promptHint.textContent = "Kirjoita suomeksi ↓";
  } else {
    promptWord.textContent = firstAcceptedAnswer(current.fi);
    langPill.textContent = "FI";
    langPill.className = "lang-pill fi";
    promptHint.textContent = `Kirjoita ${LANGS[targetLang].label} ↓`;
  }
  clearPenPad();
  document.getElementById("micTranscript").textContent = "";
  if (direction === "target-fi" && autoSpeakToggle.checked){
    // Pieni viive, jotta kortti ehtii näkyä ennen ääntä.
    clearTimeout(autoSpeakTimer);
    autoSpeakTimer = setTimeout(speakWord, 350);
  }
}

function acceptedAnswers(){
  const raw = direction === "target-fi" ? current.fi : current[targetLang];
  return raw.split("/").map(s => s.trim());
}

// Vastauksen kieli: jos kysytään kohdekielellä, vastataan suomeksi ja päinvastoin.
function answerLang(){
  return direction === "target-fi" ? "fi" : targetLang;
}

// Puheentunnistus palauttaa numerot usein numeroina ("2"), vaikka sana on "kaksi".
const NUMBER_WORDS = {
  fi: { "0":"nolla","1":"yksi","2":"kaksi","3":"kolme","4":"neljä","5":"viisi","6":"kuusi","7":"seitsemän","8":"kahdeksan","9":"yhdeksän","10":"kymmenen" },
  en: { "0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten" },
  de: { "0":"null","1":"eins","2":"zwei","3":"drei","4":"vier","5":"fünf","6":"sechs","7":"sieben","8":"acht","9":"neun","10":"zehn" }
};

function digitsToWords(text, lang){
  const map = NUMBER_WORDS[lang] || {};
  return text.replace(/\d+/g, (d) => map[d] || d);
}

function normalize(s){
  return s
    .trim()
    .toLowerCase()
    .replace(/[.,!?¿¡'"]/g, "")
    .replace(/\s+/g, " ");
}

// poistaa suluissa olevat tarkennukset vertailua varten, esim. "anteeksi (huomion herättämiseen)" -> "anteeksi"
function stripParenthetical(s){
  return s.replace(/\([^)]*\)/g, "").trim();
}

function canonical(s){
  return digitsToWords(normalize(stripParenthetical(s)), answerLang());
}

function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// mode vaikuttaa siihen, kuinka tarkka vertailu on:
// näppäimistö ja kynä = oikeinkirjoitus ratkaisee, puhe = sana saa olla lauseen sisällä.
function matchesAnswer(userAnswer, mode){
  const user = canonical(userAnswer || "");
  if (!user) return false;
  const options = acceptedAnswers().map(canonical).filter(Boolean);
  if (options.includes(user)) return true;
  if (mode === "mic"){
    return options.some(opt => new RegExp("(^|\\s)" + escapeRegExp(opt) + "($|\\s)").test(user));
  }
  return false;
}

async function recordResult(isCorrect, mode){
  const id = statId(current);
  const prev = statsCache[id] || {
    statId: id,
    wordId: current.id,
    language: targetLang,
    level: VOCAB.meta.level,
    correctCount: 0,
    incorrectCount: 0,
    streakCorrect: 0,
    streakTargetFi: 0,
    streakFiTarget: 0,
    streakKeyboard: 0,
    streakMic: 0
  };
  if (isCorrect){
    prev.correctCount += 1;
    prev.streakCorrect = (prev.streakCorrect || 0) + 1;
    if (mode === "pen"){
      // Piirtovaihe: suunnat lasketaan erikseen, kuten aiemmassa ⭐-mittarissa.
      if (direction === "target-fi") prev.streakTargetFi = (prev.streakTargetFi || 0) + 1;
      else prev.streakFiTarget = (prev.streakFiTarget || 0) + 1;
    } else if (mode === "keyboard"){
      prev.streakKeyboard = (prev.streakKeyboard || 0) + 1;
    } else if (mode === "mic"){
      prev.streakMic = (prev.streakMic || 0) + 1;
    }
  } else {
    prev.incorrectCount += 1;
    prev.streakCorrect = 0;
    // Vain käytetyn vaiheen (ja piirrossa vain kysytyn suunnan) laskuri nollautuu.
    if (mode === "pen"){
      if (direction === "target-fi") prev.streakTargetFi = 0;
      else prev.streakFiTarget = 0;
    } else if (mode === "keyboard"){
      prev.streakKeyboard = 0;
    } else if (mode === "mic"){
      prev.streakMic = 0;
    }
  }
  prev.lastSeen = new Date().toISOString();
  statsCache[id] = prev;
  await putStat(prev);
}

async function checkAnswer(userAnswer, mode){
  const usedMode = mode || activeMode;
  const isCorrect = matchesAnswer(userAnswer, usedMode);
  feedback.className = "feedback " + (isCorrect ? "correct" : "incorrect");
  if (isCorrect){
    feedback.textContent = "🎉 Oikein!";
  } else {
    feedback.innerHTML = "🙈 Ei ihan. <span class='answer-reveal'>Oikea vastaus: " + acceptedAnswers()[0] + "</span>";
  }
  await recordResult(isCorrect, usedMode);
  setTimeout(pickWord, isCorrect ? 900 : 2000);
}

function showNote(text){
  feedback.className = "feedback";
  feedback.textContent = text;
}

document.getElementById("checkBtn").addEventListener("click", async () => {
  if (activeMode === "keyboard"){
    checkAnswer(answerBox.value, "keyboard");
    return;
  }
  if (activeMode === "pen"){
    if (!penRecognitionReady){
      if (!penFallbackBox.value.trim()){
        showNote("✏️ Kirjoita ensin vastaus ruutuun.");
        return;
      }
      // Gboardin käsialantunnistus voi vielä täydentää tai korjata sanaa hetken
      // painalluksen jälkeen - odotetaan, että teksti on pysynyt muuttumattomana
      // pari sekuntia, ennen kuin se käsitellään lopullisena vastauksena.
      await waitForFallbackStable();
      checkAnswer(penFallbackBox.value, "pen");
      return;
    }
    if (!penStrokes.length){
      showNote("✏️ Kirjoita ensin vastaus ruutuun.");
      return;
    }
    let readings = [];
    try {
      readings = await readHandwriting(answerLang());
    } catch (err){
      showNote("Käsialan tunnistus ei onnistunut: " + err.name);
      return;
    }
    if (!readings.length){
      showNote("En saanut käsialasta selvää — kokeile kirjoittaa isommalla.");
      return;
    }
    penReading.textContent = "Luin: " + readings[0];
    const hit = readings.find(r => matchesAnswer(r, "pen"));
    checkAnswer(hit || readings[0], "pen");
    return;
  }
  if (activeMode === "mic"){
    checkAnswer(document.getElementById("micTranscript").textContent, "mic");
  }
});

document.getElementById("skipBtn").addEventListener("click", pickWord);

// "Näytä sana" -paljastaa oikean vastauksen suoraan, jotta lapsi voi tarkastaa
// tuntemattoman sanan sen sijaan, että joutuisi arvaamaan sokkona. Tämän
// jälkeen kirjoituslaatikko/kynä/mikki ja Tarkista-nappi piilotetaan, jottei
// paljastettua vastausta voi vain kopioida - ainoa tapa jatkaa on Ohita, eikä
// sana lasketa oikein tai väärin vastatuksi.
revealBtn.addEventListener("click", () => {
  revealBox.textContent = "🔤 " + acceptedAnswers()[0];
  answerArea.classList.add("revealed");
});

answerBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("checkBtn").click();
});

hearBtn.addEventListener("click", speakWord);

// --- Input mode switching ---
// Syöttötapa vaihtuu VAIN tästä käsivalinnasta - sovellus ei koskaan vaihda
// tilaa itse kesken harjoittelun (ks. kommentti activeMode-muuttujan luona).
function setMode(mode){
  activeMode = mode;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("mode-keyboard").classList.toggle("visible", mode === "keyboard");
  document.getElementById("mode-pen").classList.toggle("visible", mode === "pen");
  document.getElementById("mode-mic").classList.toggle("visible", mode === "mic");
  renderTierBadge(); // tähtibadge vaihtuu näyttämään valitun menetelmän oman asteikon
  if (mode === "pen") preparePenMode();
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.mode === activeMode) return; // jo valittuna
    setMode(btn.dataset.mode);
    // Graduoitumiskriteeri riippuu valitusta tavasta, joten aktiivijoukko
    // pitää rakentaa uudelleen heti kun lapsi vaihtaa tilaa käsin - muuten
    // pooli voisi jäädä näyttämään edellisen tilan jo graduoimia sanoja.
    initSessionPool();
  });
});

// --- Kynäsyöttö (vaihe 5) ---
// Vedot talletetaan pisteinä (x, y, aika), koska käsinkirjoitustunnistus tarvitsee
// kirjoitusliikkeen, ei valmista kuvaa.
const penPad = document.getElementById("penPad");
const penCtx = penPad.getContext("2d");
const penTools = document.getElementById("penTools");
const penHint = document.getElementById("penHint");
const penReading = document.getElementById("penReading");
const penFallbackBox = document.getElementById("penFallbackBox");
const penStabilizing = document.getElementById("penStabilizing");

let penStrokes = [];
let activeStroke = null;
let penInputType = "touch";
let penRecognitionReady = false;

// --- Suoja tavallista näppäilyä vastaan piirto-laatikossa ---
// Selain ei voi tietää, tuottiko Gboard tekstin käsialantunnistuksella vai
// tavallisella näppäilyllä, mutta ne näkyvät erilaisina input-tapahtumina:
// käsialantunnistus (ja sanelu) lisää yleensä ison tekstinpätkän kerralla,
// kun taas tavallinen näppäily tuottaa nopean, tasaisen kirjain-kerrallaan-sarjan.
// Jos tällainen sarja havaitaan, laatikko tyhjennetään ja pyydetään käyttämään kynää.
// Tämä ei valitettavasti tunnista Gboardin omaa sanelupainiketta (mikki), koska
// sekin lisää tekstin isompina pätkinä - vain tavallinen näppäily saadaan estettyä.
const RAPID_TYPE_GAP_MS = 900;
const RAPID_TYPE_COUNT = 3;
let fallbackPrevLength = 0;
let fallbackRapidCount = 0;
let fallbackLastSingleCharAt = 0;
let fallbackLastInputAt = 0;

function resetFallbackTypingGuard(){
  fallbackPrevLength = penFallbackBox ? penFallbackBox.value.length : 0;
  fallbackRapidCount = 0;
  fallbackLastSingleCharAt = 0;
  fallbackLastInputAt = 0;
}

function handleFallbackInput(){
  fallbackLastInputAt = Date.now();
  const value = penFallbackBox.value;
  const delta = value.length - fallbackPrevLength;
  fallbackPrevLength = value.length;

  if (delta === 1){
    const now = Date.now();
    fallbackRapidCount = (fallbackLastSingleCharAt && (now - fallbackLastSingleCharAt) < RAPID_TYPE_GAP_MS)
      ? fallbackRapidCount + 1
      : 1;
    fallbackLastSingleCharAt = now;
    if (fallbackRapidCount >= RAPID_TYPE_COUNT){
      penFallbackBox.value = "";
      resetFallbackTypingGuard();
      showNote("✋ Käytä kynää (Gboardin käsialatilaa) - tavallinen näppäily ei käy tässä vaiheessa.");
    }
  } else {
    // Isompi pätkä kerralla (käsialantunnistus/sanelu) tai poisto - ei epäilyttävää, nollataan laskuri.
    fallbackRapidCount = 0;
  }
}

// Odottaa, että piirtolaatikon teksti on pysynyt muuttumattomana PEN_STABILIZE_MS
// ajan, ennen kuin se hyväksytään lopulliseksi vastaukseksi - Gboardin käsialan-
// tunnistus voi vielä täydentää tai korjata sanaa hetken kirjoittamisen jälkeen.
const PEN_STABILIZE_MS = 2000;
async function waitForFallbackStable(){
  penStabilizing.hidden = false;
  if (!fallbackLastInputAt) fallbackLastInputAt = Date.now();
  while (Date.now() - fallbackLastInputAt < PEN_STABILIZE_MS){
    await new Promise(r => setTimeout(r, 150));
  }
  penStabilizing.hidden = true;
}

function setupPenPad(){
  const rect = penPad.getBoundingClientRect();
  if (!rect.width) return;
  penPad.width = rect.width * devicePixelRatio;
  penPad.height = rect.height * devicePixelRatio;
  penCtx.setTransform(1, 0, 0, 1, 0, 0);
  penCtx.scale(devicePixelRatio, devicePixelRatio);
  penCtx.lineWidth = 3;
  penCtx.lineCap = "round";
  penCtx.lineJoin = "round";
  penCtx.strokeStyle = "#2b2140";
  redrawPen();
}

function redrawPen(){
  penCtx.clearRect(0, 0, penPad.width, penPad.height);
  penStrokes.forEach(s => {
    penCtx.beginPath();
    s.points.forEach((p, i) => i ? penCtx.lineTo(p.x, p.y) : penCtx.moveTo(p.x, p.y));
    penCtx.stroke();
  });
}

function clearPenPad(){
  penStrokes = [];
  activeStroke = null;
  if (penPad.width) penCtx.clearRect(0, 0, penPad.width, penPad.height);
  if (penReading) penReading.textContent = "";
  if (penFallbackBox) penFallbackBox.value = "";
  if (penStabilizing) penStabilizing.hidden = true;
  resetFallbackTypingGuard();
}

penFallbackBox.addEventListener("input", handleFallbackInput);

function penPoint(e){
  const rect = penPad.getBoundingClientRect();
  return {
    x: Math.round(e.clientX - rect.left),
    y: Math.round(e.clientY - rect.top),
    t: Math.round(performance.now())
  };
}

penPad.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  penPad.setPointerCapture(e.pointerId);
  penInputType = e.pointerType === "pen" ? "stylus" : (e.pointerType === "mouse" ? "mouse" : "touch");
  const p = penPoint(e);
  activeStroke = { points: [p] };
  penCtx.beginPath();
  penCtx.moveTo(p.x, p.y);
});

penPad.addEventListener("pointermove", (e) => {
  if (!activeStroke) return;
  e.preventDefault();
  const p = penPoint(e);
  activeStroke.points.push(p);
  penCtx.lineTo(p.x, p.y);
  penCtx.stroke();
});

function endStroke(){
  if (activeStroke && activeStroke.points.length) penStrokes.push(activeStroke);
  activeStroke = null;
}
["pointerup","pointercancel","pointerleave"].forEach(evt => penPad.addEventListener(evt, endStroke));

document.getElementById("penClear").addEventListener("click", clearPenPad);

// Chromen käsinkirjoitustunnistus. Sitä ei ole kaikilla laitteilla eikä kaikille
// kielille, joten tuki kysytään ennen käyttöä ja muuten käytetään laitteen omaa
// kynä-tekstiksi-muunnosta tavallisessa tekstikentässä.
async function penLanguageSupported(lang){
  if (!navigator.queryHandwritingRecognizer) return false;
  try {
    return !!(await navigator.queryHandwritingRecognizer({ languages: [lang] }));
  } catch (err){
    return false;
  }
}

async function readHandwriting(lang){
  const recognizer = await navigator.createHandwritingRecognizer({ languages: [lang] });
  const drawing = recognizer.startDrawing({
    recognitionType: "text",
    inputType: penInputType,
    alternatives: 3
  });
  penStrokes.forEach(s => {
    const stroke = new HandwritingStroke();
    s.points.forEach(p => stroke.addPoint(p));
    drawing.addStroke(stroke);
  });
  const predictions = await drawing.getPrediction();
  drawing.clear();
  recognizer.finish();
  return (predictions || []).map(p => p.text).filter(Boolean);
}

// Sovellus vaihtelee kysymyksen suuntaa, joten piirtoalusta otetaan käyttöön vain
// jos molemmat kielet ovat tuettuja - muuten syöttötapa vaihtuisi kesken harjoituksen.
async function preparePenMode(){
  penRecognitionReady = (await penLanguageSupported(targetLang)) && (await penLanguageSupported("fi"));
  penPad.hidden = !penRecognitionReady;
  penTools.hidden = !penRecognitionReady;
  penFallbackBox.hidden = penRecognitionReady;
  if (penRecognitionReady){
    penHint.textContent = "Kirjoita vastaus ruutuun kynällä ja paina Tarkista.";
    setupPenPad();
  } else {
    penHint.textContent = "Kosketa laatikkoa ja vaihda Gboardissa näppäimistöksi \"Käsiala\" (näppäimistön asetukset-kuvake → Käsiala), kirjoita sitten kynällä. Tavallinen näppäily ei kelpaa tässä vaiheessa.";
  }
}

// --- Speech recognition (mic mode) — kevyt demo Web Speech API:lla, jos selain tukee ---
const micBtn = document.getElementById("micBtn");
const micTranscript = document.getElementById("micTranscript");
let recognizing = false;
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

const ERROR_TEXTS = {
  "not-allowed": "Selain esti mikrofonin käytön (lupa evätty tai sivu on upotetussa kehyksessä).",
  "service-not-allowed": "Selain esti puheentunnistuspalvelun käytön.",
  "no-speech": "En kuullut mitään — kokeile uudestaan lähempänä mikrofonia.",
  "audio-capture": "Mikrofonia ei löytynyt tästä laitteesta.",
  "network": "Puheentunnistus tarvitsee verkkoyhteyden, eikä se nyt onnistunut.",
  "aborted": "Puheentunnistus keskeytyi."
};

// Kertoo miksi mikrofoni ei ole käytettävissä, ennen kuin sitä yritetään käyttää.
function micBlockedReason(){
  if (!window.isSecureContext) return "Sivu ei ole https-yhteydessä, joten selain ei anna mikrofonia.";
  if (!navigator.mediaDevices) return "Selain ei anna mikrofonia tälle sivulle — sivu on todennäköisesti upotetussa kehyksessä. Avaa sovellus omassa https-osoitteessaan.";
  if (!SpeechRecognition) return "Tämä selain ei tue puheentunnistusta.";
  return null;
}

function showMicMessage(text){
  micTranscript.textContent = text;
  micTranscript.style.color = "#e53935";
  micTranscript.style.fontSize = "15px";
  micTranscript.style.fontWeight = "600";
}

function clearMicMessage(){
  micTranscript.style.color = "";
  micTranscript.style.fontSize = "";
  micTranscript.style.fontWeight = "";
}

if (SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    clearMicMessage();
    const heard = e.results[0][0].transcript;
    micTranscript.textContent = heard;
    checkAnswer(heard, "mic"); // tarkistetaan heti, lapsen ei tarvitse painaa mitään
  };
  recognition.onerror = (e) => {
    showMicMessage((ERROR_TEXTS[e.error] || "Puheentunnistus ei onnistunut.") + " [" + e.error + "]");
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove("listening");
  };
}

micBtn.addEventListener("click", () => {
  const blocked = micBlockedReason();
  if (blocked){
    showMicMessage(blocked);
    return;
  }
  recognition.lang = direction === "target-fi" ? "fi-FI" : LANGS[targetLang].speech;
  if (!recognizing){
    clearMicMessage();
    micTranscript.textContent = "";
    // Katkaistaan mahdollinen ääneen luku (myös viivästetty automaattiääntäminen), jottei mikrofoni kuule sovelluksen omaa puhetta.
    clearTimeout(autoSpeakTimer);
    if (window.speechSynthesis) speechSynthesis.cancel();
    try {
      recognition.start();
      recognizing = true;
      micBtn.classList.add("listening");
    } catch (err) {
      showMicMessage("Puheentunnistusta ei voitu käynnistää: " + err.name);
    }
  } else {
    recognition.stop();
  }
});

// --- Varmuuskopiointi (vienti/tuonti) ---
// IndexedDB tallentaa edistymisen vain tähän selaimeen tällä laitteella - se ei
// siirry itsestään toiselle laitteelle tai selaimelle. Varmuuskopio JSON-tiedostoon
// antaa mahdollisuuden tallentaa edistymisen talteen ja tarvittaessa siirtää sen,
// samaan tapaan kuin Rautakirja-sovelluksessa varmuuskopiot OneDriveen.
const backupNote = document.getElementById("backupNote");

function showBackupNote(text){
  backupNote.textContent = text;
}

async function exportBackup(){
  const stats = await getAllStats();
  const backup = {
    app: "sanaseikkailu",
    exported_at: new Date().toISOString(),
    language_targets: Object.keys(LANGS),
    level: VOCAB.meta.level,
    stats
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `sanaseikkailu-varmuuskopio-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showBackupNote(`Tallennettu ${stats.length} sanan tiedot.`);
}

async function importBackupFile(file){
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    showBackupNote("Tiedostoa ei voitu lukea - tarkista, että se on oikea varmuuskopiotiedosto.");
    return;
  }
  const stats = Array.isArray(data?.stats) ? data.stats : null;
  if (!stats){
    showBackupNote("Tiedosto ei sisältänyt tunnistettavaa edistymistä.");
    return;
  }
  let imported = 0;
  for (const stat of stats){
    if (stat && typeof stat.statId === "string"){
      await putStat(stat);
      imported++;
    }
  }
  await updateHeaderStats();
  showBackupNote(`Tuotu ${imported} sanan tiedot.`);
}

document.getElementById("exportBtn").addEventListener("click", exportBackup);
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) importBackupFile(file);
  e.target.value = "";
});

// --- init ---
window.addEventListener("resize", () => { if (activeMode === "pen") setupPenPad(); });

(async function init(){
  syncLangButtons(); // varmistaa napin tilan ja tekstin, jos kieli muistettiin laitteelta
  activeGrade = loadOrDetectGrade(targetLang); // ennen DB:tä -> oletus 1. luokka
  setupGradeFilter();
  setupCategoryFilter();
  initSessionPool(); // ensimmäinen pooli ilman tallennettua edistymistä (DB ei vielä ladattu)
  pickWord(); // ensimmäinen sana näkyviin heti, ei odoteta tietokantaa
  try {
    db = await openDB();
  } catch (e) {
    console.warn("IndexedDB ei käytettävissä, edistymistä ei tallenneta:", e);
  }
  await updateHeaderStats();
  // Nyt kun oikea edistyminen on tiedossa: jos luokka-astetta ei ole erikseen
  // valittu tällä laitteella, päätellään oppilaan todellinen lähtökohta
  // tilastoista (ks. detectFrontierGrade) sen sijaan että jäätäisiin ykkösluokkaan.
  if (!hasExplicitGradeChoice(targetLang)){
    activeGrade = detectFrontierGrade();
    populateGradeOptions();
    currentCategory = "all";
    populateCategoryOptions();
  }
  initSessionPool(); // rakennetaan pooli uudelleen nyt kun oikea edistyminen on tiedossa
  pickWord();
})();
</script>
