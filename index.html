<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sanaseikkailu</title>
<style>
  :root{
    --bg-top:#fef6e4;
    --bg-bottom:#e0f7fa;
    --card-bg:#ffffff;
    --ink:#2b2140;
    --accent:#ff8a65;
    --accent-dark:#e8683f;
    --good:#43a047;
    --bad:#e53935;
    --pill-en:#5c6bc0;
    --pill-fi:#26a69a;
    --shadow: 0 10px 30px rgba(43,33,64,0.15);
    --radius: 28px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: "Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
    background: linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--ink);
    overflow-x:hidden;
  }
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 16px 40px;
  }
  header{
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: clamp(20px, 4vw, 30px);
    font-weight:800;
  }
  .brand .mascot{
    font-size: 1.4em;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  .streak{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card-bg);
    padding:8px 16px;
    border-radius:999px;
    box-shadow: var(--shadow);
    font-weight:700;
    font-size: clamp(14px,2.5vw,18px);
  }
  main{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .progress-bar{
    width:100%;
    height:14px;
    background:#ffffffaa;
    border-radius:999px;
    overflow:hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .progress-bar > div{
    height:100%;
    width:30%;
    background:linear-gradient(90deg,#ffca28,var(--accent));
    border-radius:999px;
    transition: width .4s ease;
  }
  .prompt-card{
    width:100%;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding: 34px 24px;
    text-align:center;
    position:relative;
  }
  .lang-pill{
    display:inline-block;
    padding:6px 18px;
    border-radius:999px;
    color:white;
    font-weight:800;
    font-size: clamp(13px,2.5vw,16px);
    letter-spacing:0.5px;
    margin-bottom:14px;
  }
  .lang-pill.en{ background:var(--pill-en); }
  .lang-pill.fi{ background:var(--pill-fi); }
  .prompt-word{
    font-size: clamp(36px, 9vw, 64px);
    font-weight:800;
    margin: 6px 0 4px;
    word-break: break-word;
  }
  .prompt-hint{
    color:#7a7189;
    font-size: clamp(14px,3vw,17px);
  }
  .speak-btn{
    margin-top:14px;
    border:none;
    background:#fff3e0;
    color:var(--accent-dark);
    width:56px;
    height:56px;
    border-radius:50%;
    font-size:26px;
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .speak-btn:active{ transform: scale(0.94); }

  .answer-area{
    width:100%;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .input-modes{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .mode-btn{
    border:2px solid transparent;
    background:#f4f2fa;
    color:var(--ink);
    padding:10px 18px;
    border-radius:999px;
    font-size: clamp(14px,3vw,16px);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent-dark);
  }

  .answer-input-wrap{ display:none; }
  .answer-input-wrap.visible{ display:flex; flex-direction:column; gap:14px; }

  .answer-box{
    width:100%;
    font-size: clamp(22px,5vw,30px);
    padding: 18px 20px;
    border-radius:20px;
    border:3px solid #e6e1f5;
    text-align:center;
    font-weight:700;
    color:var(--ink);
    background:#fbfaff;
  }
  .answer-box:focus{
    outline:none;
    border-color:var(--accent);
  }

  .pen-pad-wrap{ display:none; flex-direction:column; align-items:center; gap:10px; }
  .pen-pad-wrap.visible{ display:flex; }
  canvas.pen-pad{
    width:100%;
    max-width:600px;
    height:220px;
    background:#fbfaff;
    border-radius:20px;
    border:3px solid #e6e1f5;
    touch-action:none;
  }
  .pen-tools{ display:flex; gap:10px; }
  .pen-tools button{
    border:none;
    background:#f4f2fa;
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
  }

  .mic-wrap{ display:none; flex-direction:column; align-items:center; gap:14px; padding: 10px 0 4px; }
  .mic-wrap.visible{ display:flex; }
  .mic-btn{
    width:110px; height:110px;
    border-radius:50%;
    border:none;
    background: radial-gradient(circle at 35% 30%, #ffab91, var(--accent));
    color:white;
    font-size:44px;
    box-shadow: var(--shadow);
    cursor:pointer;
  }
  .mic-btn.listening{
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,138,101,0.55); }
    70%{ box-shadow:0 0 0 26px rgba(255,138,101,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,138,101,0); }
  }
  .mic-hint{ color:#7a7189; font-size:15px; text-align:center; }
  .mic-transcript{
    min-height:34px;
    font-size:22px;
    font-weight:700;
  }

  .actions{
    display:flex;
    gap:14px;
    justify-content:center;
  }
  .btn{
    border:none;
    padding: 16px 34px;
    border-radius:999px;
    font-size: clamp(16px,3.5vw,20px);
    font-weight:800;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .btn.primary{
    background: linear-gradient(180deg,#ffca28,var(--accent));
    color:#3a2410;
  }
  .btn.primary:active{ transform: scale(0.97); }
  .btn.ghost{
    background:#f4f2fa;
    color:var(--ink);
  }

  .feedback{
    min-height: 62px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size: clamp(18px,4vw,24px);
    font-weight:800;
    border-radius:20px;
    padding: 10px 16px;
    transition: background .2s ease;
  }
  .feedback.correct{ background:#e8f5e9; color:var(--good); }
  .feedback.incorrect{ background:#ffebee; color:var(--bad); }
  .feedback .answer-reveal{ font-weight:600; font-size:0.75em; color:#7a7189; }

  footer{
    margin-top:26px;
    color:#7a7189cc;
    font-size:13px;
    text-align:center;
  }

  @media (max-width: 420px){
    .prompt-card, .answer-area{ padding:20px 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="mascot">🦊</span> Sanaseikkailu</div>
    <div class="streak"><span>🔥</span><span id="streakCount">0</span></div>
  </header>

  <main>
    <div class="progress-bar"><div id="progressFill"></div></div>

    <section class="prompt-card">
      <span class="lang-pill" id="langPill">EN</span>
      <div class="prompt-word" id="promptWord">apple</div>
      <div class="prompt-hint" id="promptHint">Kirjoita suomeksi &darr;</div>
      <button class="speak-btn" id="hearBtn" title="Kuuntele sana">🔊</button>
    </section>

    <section class="answer-area">
      <div class="input-modes">
        <button class="mode-btn active" data-mode="keyboard">⌨️ Näppäimistö</button>
        <button class="mode-btn" data-mode="pen">✏️ Kynä</button>
        <button class="mode-btn" data-mode="mic">🎤 Puhu</button>
      </div>

      <div class="answer-input-wrap visible" id="mode-keyboard">
        <input type="text" class="answer-box" id="answerBox" placeholder="Kirjoita vastaus tähän..." autocomplete="off">
      </div>

      <div class="pen-pad-wrap" id="mode-pen">
        <canvas class="pen-pad" id="penPad"></canvas>
        <div class="pen-tools">
          <button id="penClear">🗑️ Tyhjennä</button>
        </div>
      </div>

      <div class="mic-wrap" id="mode-mic">
        <button class="mic-btn" id="micBtn">🎤</button>
        <div class="mic-hint">Paina ja sano sana ääneen</div>
        <div class="mic-transcript" id="micTranscript"></div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="skipBtn">Ohita</button>
        <button class="btn primary" id="checkBtn">Tarkista</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </section>
  </main>

  <footer>Sanaseikkailu · pilottiversio · UI-prototyyppi (vaihe 3)</footer>
</div>

<script>
/*
  UI-PROTOTYYPPI - vaihe 3
  ------------------------
  Tämä tiedosto on käyttöliittymäprototyyppi. Mukana on kevyt näyttelijälogiikka
  (satunnainen sana pienestä esimerkkilistasta, yksinkertainen tarkistus),
  jotta ulkoasua voi kokeilla oikeasti tabletilla. Varsinainen ydinlogiikka
  (koko sanaston käyttö, pisteytys, edistymisen tallennus IndexedDB:hen,
  oikea käsinkirjoitus- ja puheentunnistus) rakennetaan vaiheissa 4 ja 5.
*/

const SAMPLE_WORDS = [
  { en: "apple", fi: "omena" },
  { en: "teacher", fi: "opettaja" },
  { en: "brave", fi: "rohkea" },
  { en: "friend", fi: "ystävä" },
  { en: "run", fi: "juosta" },
  { en: "cheese", fi: "juusto" }
];

let current = null;
let direction = "en-fi"; // en-fi = kysytään englanniksi, vastataan suomeksi
let streak = 0;
let activeMode = "keyboard";

const promptWord = document.getElementById("promptWord");
const promptHint = document.getElementById("promptHint");
const langPill = document.getElementById("langPill");
const answerBox = document.getElementById("answerBox");
const feedback = document.getElementById("feedback");
const streakCount = document.getElementById("streakCount");
const progressFill = document.getElementById("progressFill");
const hearBtn = document.getElementById("hearBtn");

function pickWord(){
  current = SAMPLE_WORDS[Math.floor(Math.random() * SAMPLE_WORDS.length)];
  direction = Math.random() < 0.5 ? "en-fi" : "fi-en";
  renderPrompt();
}

function renderPrompt(){
  feedback.className = "feedback";
  feedback.textContent = "";
  answerBox.value = "";
  if (direction === "en-fi"){
    promptWord.textContent = current.en;
    langPill.textContent = "EN";
    langPill.className = "lang-pill en";
    promptHint.textContent = "Kirjoita suomeksi ↓";
  } else {
    promptWord.textContent = current.fi;
    langPill.textContent = "FI";
    langPill.className = "lang-pill fi";
    promptHint.textContent = "Kirjoita englanniksi ↓";
  }
  progressFill.style.width = (10 + Math.random()*80).toFixed(0) + "%";
  clearPenPad();
  document.getElementById("micTranscript").textContent = "";
}

function correctAnswer(){
  return direction === "en-fi" ? current.fi : current.en;
}

function checkAnswer(userAnswer){
  const normalize = s => s.trim().toLowerCase();
  const isCorrect = normalize(userAnswer) === normalize(correctAnswer());
  feedback.className = "feedback " + (isCorrect ? "correct" : "incorrect");
  if (isCorrect){
    streak += 1;
    streakCount.textContent = streak;
    feedback.textContent = "🎉 Oikein!";
  } else {
    streak = 0;
    streakCount.textContent = streak;
    feedback.innerHTML = "🙈 Ei ihan. <span class='answer-reveal'>Oikea vastaus: " + correctAnswer() + "</span>";
  }
  setTimeout(pickWord, isCorrect ? 900 : 1800);
}

document.getElementById("checkBtn").addEventListener("click", () => {
  if (activeMode === "keyboard"){
    checkAnswer(answerBox.value);
  } else if (activeMode === "pen"){
    // Prototyypissä ei ole vielä käsinkirjoitustunnistusta (tulee vaiheessa 5).
    feedback.className = "feedback";
    feedback.textContent = "✏️ Käsinkirjoitustunnistus tulee myöhemmin (vaihe 5).";
  } else if (activeMode === "mic"){
    const t = document.getElementById("micTranscript").textContent;
    checkAnswer(t);
  }
});

document.getElementById("skipBtn").addEventListener("click", pickWord);

answerBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("checkBtn").click();
});

hearBtn.addEventListener("click", () => {
  if ("speechSynthesis" in window){
    const utter = new SpeechSynthesisUtterance(promptWord.textContent);
    utter.lang = direction === "en-fi" ? "en-GB" : "fi-FI";
    speechSynthesis.speak(utter);
  }
});

// --- Input mode switching ---
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeMode = btn.dataset.mode;
    document.getElementById("mode-keyboard").classList.toggle("visible", activeMode === "keyboard");
    document.getElementById("mode-pen").classList.toggle("visible", activeMode === "pen");
    document.getElementById("mode-mic").classList.toggle("visible", activeMode === "mic");
    if (activeMode === "pen") setupPenPad();
  });
});

// --- Pen pad (kevyt piirtoalusta, ei vielä tunnistusta) ---
const penPad = document.getElementById("penPad");
const penCtx = penPad.getContext("2d");
let drawing = false;

function setupPenPad(){
  const rect = penPad.getBoundingClientRect();
  penPad.width = rect.width * devicePixelRatio;
  penPad.height = rect.height * devicePixelRatio;
  penCtx.scale(devicePixelRatio, devicePixelRatio);
  penCtx.lineWidth = 3;
  penCtx.lineCap = "round";
  penCtx.strokeStyle = "#2b2140";
}

function getPos(e){
  const rect = penPad.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}

function clearPenPad(){
  if (penPad.width) penCtx.clearRect(0,0,penPad.width, penPad.height);
}

["mousedown","touchstart"].forEach(evt => penPad.addEventListener(evt, e => {
  drawing = true;
  const p = getPos(e);
  penCtx.beginPath();
  penCtx.moveTo(p.x,p.y);
  e.preventDefault();
}));
["mousemove","touchmove"].forEach(evt => penPad.addEventListener(evt, e => {
  if (!drawing) return;
  const p = getPos(e);
  penCtx.lineTo(p.x,p.y);
  penCtx.stroke();
  e.preventDefault();
}));
["mouseup","touchend","mouseleave"].forEach(evt => penPad.addEventListener(evt, () => drawing = false));
document.getElementById("penClear").addEventListener("click", clearPenPad);

// --- Speech recognition (mic mode) — kevyt demo Web Speech API:lla, jos selain tukee ---
const micBtn = document.getElementById("micBtn");
const micTranscript = document.getElementById("micTranscript");
let recognizing = false;
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    micTranscript.textContent = e.results[0][0].transcript;
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove("listening");
  };
}

micBtn.addEventListener("click", () => {
  if (!recognition){
    micTranscript.textContent = "(Puheentunnistusta ei tueta tässä selaimessa vielä)";
    return;
  }
  recognition.lang = direction === "en-fi" ? "fi-FI" : "en-GB";
  if (!recognizing){
    recognition.start();
    recognizing = true;
    micBtn.classList.add("listening");
  } else {
    recognition.stop();
  }
});

// init
window.addEventListener("resize", () => { if (activeMode === "pen") setupPenPad(); });
pickWord();
</script>
</body>
</html>
